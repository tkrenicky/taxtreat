name: Align PDF-only acceptance

on:
  push:
    branches:
      - redesign/unified-product-report-20260817
    paths:
      - scripts/align_pdf_only_acceptance.py
      - .github/workflows/align-pdf-only-acceptance.yml

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/align_pdf_only_acceptance.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_workspace_report_export.py scripts/check_workspace_report_export.py scripts/render_professional_report_acceptance.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Align acceptance with PDF-only report flow"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi
