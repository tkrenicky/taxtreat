name: Apply PR150 acceptance alignment

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817
    paths:
      - scripts/apply_pr150_acceptance_fix.py
      - .github/workflows/apply-pr150-acceptance-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_pr150_acceptance_fix.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_app.py tests/test_stage7a_calculation.py tests/test_stage7a_reporting.py tests/test_stage7b_ui.py scripts/render_professional_report_acceptance.py scripts/check_workspace_report_export.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Align PR150 acceptance contracts"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
