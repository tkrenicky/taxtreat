name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Clean-install smoke test
        run: |
          python -c "import app.main; import taxtreat"
          python -m taxtreat.pipeline.run_pipeline

      - name: Run project test suite
        run: |
          python -m pytest \
            --cov=taxtreat \
            --cov=app \
            --cov-branch \
            --cov-fail-under=96 \
            --cov-report=term-missing

      - name: Run Stage 7B browser acceptance
        run: python scripts/capture_stage7b_ui.py artifacts/stage7b

      - name: Upload Stage 7B browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7b-browser-evidence-python-${{ matrix.python-version }}
          path: artifacts/stage7b
          if-no-files-found: warn
          retention-days: 30

      - name: Build Stage 7A acceptance evidence
        run: |
          python scripts/run_stage7a_acceptance.py \
            --output-dir artifacts/stage7a
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = (
              "3140c31835596f00686f9ad99fc2cddaf43c185ab"
              "94a73c94bccf993fe159486"
          )
          root = Path(".")
          digest = hashlib.sha256()
          for path in sorted(
              (root / "data/legal_rule_candidates/final23").glob("*.json")
          ):
              digest.update(str(path.relative_to(root)).encode())
              digest.update(b"\0")
              digest.update(path.read_bytes())
          actual = digest.hexdigest()
          assert actual == expected, (expected, actual)
          print(f"Final23 protected hash: {actual}")
          PY

      - name: Upload Stage 7A acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7a-acceptance-python-${{ matrix.python-version }}
          path: artifacts/stage7a
          if-no-files-found: error
          retention-days: 30

      - name: Canonical decision core 100% branch coverage
        run: |
          python -m pytest \
            tests/test_legal_rule_engine.py \
            tests/test_legal_rule_reliability.py \
            tests/test_legal_facts.py \
            tests/test_canonical_decision.py \
            tests/test_layered_decision.py \
            tests/test_legal_sources.py \
            --cov=taxtreat.engine.legal_rule_engine \
            --cov=taxtreat.engine.legal_rule_loader \
            --cov=taxtreat.engine.legal_rule_validator \
            --cov=taxtreat.engine.legal_facts \
            --cov=taxtreat.engine.layered_decision \
            --cov=taxtreat.engine.legal_sources \
            --cov=taxtreat.services.decision \
            --cov-branch \
            --cov-fail-under=100 \
            --cov-report=term-missing
