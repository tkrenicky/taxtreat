name: Apply information-only product wording

on:
  push:
    branches:
      - redesign/unified-product-report-20260817
    paths:
      - scripts/apply_information_only_wording.py
      - .github/workflows/apply-information-only-wording.yml

permissions:
  contents: write

jobs:
  apply-wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_information_only_wording.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/workspace.html app/web/workspace.js app/web/workspace-report-export.js taxtreat/services/reporting.py tests/test_workspace_report_export.py scripts/check_workspace_report_export.py scripts/render_professional_report_acceptance.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Use information-only product wording"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi
