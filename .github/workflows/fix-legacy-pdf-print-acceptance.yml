name: Fix legacy PDF print acceptance
on:
  push:
    branches: [redesign/unified-product-report-20260817]
    paths:
      - scripts/fix_legacy_pdf_print_acceptance.py
      - .github/workflows/fix-legacy-pdf-print-acceptance.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_legacy_pdf_print_acceptance.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/app.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Make legacy PDF print flow browser-verifiable"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi