name: Apply final professional report polish

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817
    paths:
      - scripts/apply_report_polish.py
      - .github/workflows/apply-report-polish.yml

permissions:
  contents: write

jobs:
  apply-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_report_polish.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taxtreat/services/reporting.py scripts/check_workspace_report_export.py scripts/render_professional_report_acceptance.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Polish professional client report"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
