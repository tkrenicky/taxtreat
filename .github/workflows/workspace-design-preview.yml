name: Workspace design preview

on:
  push:
    branches:
      - redesign/unified-product-report-20260817
    paths:
      - scripts/render_workspace_design_preview.py
      - .github/workflows/workspace-design-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render_workspace_design_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-design-preview
          path: reports/workspace_design_preview/*.png
