name: Regenerate SK structured treaty rules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-sk-structured-rules.yml"
      - "taxtreat/tools/build_sk_structured_treaty_rules.py"
      - "data/legal_reviews/sk_outbound/treaty_semantic_candidates.json"
      - "data/legal_reviews/sk_outbound/treaty_article_machine_extraction.json"
      - "data/legal_reviews/sk_outbound/human_review_coverage.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build structured SK treaty rules
        run: python taxtreat/tools/build_sk_structured_treaty_rules.py
      - name: Commit generated SK rule artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legal_rules_sk data/legal_reviews/sk_outbound/structured_treaty_rule_materialization_summary.json
          git commit -m "Materialize safe SK treaty rules"
          git push
