name: AT recovery compatibility

on:
  push:
    branches: [recover/at-source-country-onboarding-20260902]
    paths:
      - ".github/workflows/at-recovery-compatibility-20260902.yml"

jobs:
  at-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run recovered AT compatibility suite
        run: |
          python -m pytest -q \
            tests/test_at_*.py \
            tests/test_acquire_at_*.py \
            tests/test_build_at_*.py \
            tests/test_extract_at_treaty_article_candidates.py \
            tests/test_reconcile_at_article_text_candidates.py \
            tests/test_country_human_review_pack.py \
            tests/test_country_review_preparation.py \
            tests/test_domestic_relief_review_overlay.py \
            tests/test_official_source_cache.py \
            tests/test_review_bundle_provenance.py \
            tests/test_run_country_review_preparation.py \
            tests/test_treaty_income_semantics.py \
            tests/test_validate_review_bundle_submission.py \
            tests/test_build_treaty_scope_machine_evidence.py
