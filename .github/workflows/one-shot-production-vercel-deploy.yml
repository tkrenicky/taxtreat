name: One-shot production Vercel deploy

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/one-shot-production-vercel-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_venWZarYV6y5GELQP60DFEsp
      VERCEL_PROJECT_ID: prj_XPqvtCrJ9khKlw1R2Qpj7IAgRIws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
