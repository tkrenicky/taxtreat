name: Stage 7 101-country end-to-end QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "taxtreat/**"
      - "data/legal_rules_stage6/**"
      - "data/legal_texts/canonical_provisions.json"
      - "scripts/run_101_country_e2e_qa.py"
      - ".github/workflows/stage7-101-country-e2e.yml"
  workflow_dispatch:

jobs:
  country-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run all 101 countries and 303 scopes through runtime, intake and report
        run: python scripts/run_101_country_e2e_qa.py
      - name: Upload 101-country QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-101-country-e2e-qa
          path: reports/stage7_101_country_e2e_qa.json
          if-no-files-found: error
          retention-days: 30
