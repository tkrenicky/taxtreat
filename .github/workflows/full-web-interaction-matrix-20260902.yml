name: Full web interaction matrix audit

on:
  push:
    branches: [audit/full-web-interaction-matrix-20260902]
    paths:
      - "scripts/verify_full_web_interaction_matrix_20260902.py"
      - ".github/workflows/full-web-interaction-matrix-20260902.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          python -m playwright install chromium
      - name: Run exhaustive web/API matrix
        run: python scripts/verify_full_web_interaction_matrix_20260902.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/full_web_interaction_matrix_20260902.json
          git diff --cached --quiet || git commit -m "Capture full web interaction matrix audit"
          git pull --rebase origin audit/full-web-interaction-matrix-20260902
          git push
      - name: Fail on blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/full_web_interaction_matrix_20260902.json")
          j = json.loads(p.read_text(encoding="utf-8"))
          if j["blockers"]:
              print(json.dumps(j["blockers"], indent=2, ensure_ascii=False))
              raise SystemExit(1)
          PY
