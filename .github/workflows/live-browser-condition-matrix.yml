name: Live browser condition matrix

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "taxtreat/**"
      - "data/legal_rules_stage6/**"
      - "data/legal_rules_sk/**"
      - "scripts/run_cz_sk_combinatorial_web_qa.py"
      - "scripts/run_live_browser_condition_matrix.py"
      - ".github/workflows/live-browser-condition-matrix.yml"
  workflow_dispatch:

jobs:
  scenario-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inventory dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          pip install playwright
      - name: Count browser-reachable matrix
        run: |
          mkdir -p reports/live-browser-inventory
          for source in CZ SK; do
            for income in dividend interest royalty; do
              for lang in cs en; do
                for shard in 0 1 2 3; do
                  python scripts/run_live_browser_condition_matrix.py \
                    --source-country "$source" \
                    --income-type "$income" \
                    --lang "$lang" \
                    --shard-index "$shard" \
                    --shard-count 4 \
                    --count-only \
                    --output "reports/live-browser-inventory/${source}_${income}_${lang}_${shard}.json"
                done
              done
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("reports/live-browser-inventory").glob("*.json"))
          rows = [json.loads(path.read_text()) for path in files]
          summary = {
              "chunks": len(rows),
              "scenarios": sum(row["scenarios"] for row in rows),
              "by_source": {
                  source: sum(row["scenarios"] for row in rows if row["source_country"] == source)
                  for source in ("CZ", "SK")
              },
              "by_language": {
                  lang: sum(row["scenarios"] for row in rows if row["lang"] == lang)
                  for lang in ("cs", "en")
              },
          }
          Path("reports/live-browser-inventory/summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-condition-inventory
          path: reports/live-browser-inventory
          if-no-files-found: error
          retention-days: 30

  live-browser-matrix:
    needs: scenario-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source_country: [CZ, SK]
        income_type: [dividend, interest, royalty]
        lang: [cs, en]
        shard: [0, 1, 2, 3]
    env:
      TAXTREAT_LIVE_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start current TaxTreat application
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taxtreat-uvicorn.log 2>&1 &
          echo $! > /tmp/taxtreat-uvicorn.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ui/cs >/dev/null; then
              echo "TaxTreat is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxtreat-uvicorn.log || true
          exit 1
      - name: Synchronize native dialogs with real UI state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run_live_browser_condition_matrix.py")
          text = path.read_text(encoding="utf-8")

          old = "page.locator('[data-nav=\"payers\"]').click()"
          new = "page.locator('[data-nav=\"payers\"]:visible').first.click()\n        page.wait_for_function(\"() => Boolean(document.querySelector('[data-view=\\\"payers\\\"].active'))\")"
          if old not in text:
              raise SystemExit("payer navigation patch target missing")
          text = text.replace(old, new, 1)

          old = "page.locator(\"[data-create-payer]:visible\").click()\n        form = page.locator(\"#payer-form\")\n        form.locator('[name=\"payer_id\"]').fill(\"12345679\")"
          new = "page.locator(\"[data-create-payer]:visible\").first.click()\n        page.wait_for_function(\"() => Boolean(document.querySelector('#payer-dialog')?.open)\")\n        form = page.locator(\"#payer-dialog #payer-form\")\n        payer_country = form.locator('[name=\"payer_country\"]')\n        payer_country.wait_for(state=\"visible\")\n        payer_country.select_option(\"SK\")\n        form.locator('[name=\"payer_id\"]').wait_for(state=\"visible\")\n        form.locator('[name=\"payer_id\"]').fill(\"12345679\")"
          if old not in text:
              raise SystemExit("payer dialog patch target missing")
          text = text.replace(old, new, 1)

          old = "        form.locator('[name=\"payer_country\"]').select_option(\"SK\")\n        form.locator(\"[data-save-payer]\").click()\n        page.wait_for_function(\"() => document.body.dataset.sourceCountry === 'SK'\")"
          new = "        form.locator(\"[data-save-payer]\").click()\n        page.wait_for_function(\"() => !document.querySelector('#payer-dialog')?.open\")\n        page.wait_for_function(\"() => document.body.dataset.sourceCountry === 'SK'\")"
          if old not in text:
              raise SystemExit("payer save patch target missing")
          text = text.replace(old, new, 1)

          old = "    page.locator('[data-view=\"recipient-detail\"] [data-edit-recipient]:visible').click()\n    dialog = page.locator(\"#recipient-edit-form\")"
          new = "    page.locator('[data-view=\"recipient-detail\"] [data-edit-recipient]:visible').click()\n    page.wait_for_function(\"() => Boolean(document.querySelector('#recipient-dialog')?.open)\")\n    dialog = page.locator(\"#recipient-dialog #recipient-edit-form\")"
          if old not in text:
              raise SystemExit("recipient open patch target missing")
          text = text.replace(old, new, 1)

          old = "    dialog.locator('button[type=\"submit\"]').click()\n    page.wait_for_function(\n        \"(code) => document.querySelector('#recipient-edit-form [name=recipient_country]').value === code\",\n        arg=recipient_country,\n    )"
          new = "    dialog.locator('button[type=\"submit\"]').click()\n    page.wait_for_function(\"() => !document.querySelector('#recipient-dialog')?.open\")"
          if old not in text:
              raise SystemExit("recipient close patch target missing")
          text = text.replace(old, new, 1)

          old = "def set_radio(form, name: str, value: bool) -> None:\n    form.locator(f'[name=\"{name}\"][value=\"{str(bool(value)).lower()}\"]').check()"
          new = "def set_radio(form, name: str, value: bool) -> None:\n    radio = form.locator(f'[name=\"{name}\"][value=\"{str(bool(value)).lower()}\"]')\n    label = radio.locator(\"xpath=ancestor::label[1]\")\n    check(label.count() == 1, f\"missing visible label for {name}\")\n    label.click()\n    check(radio.is_checked(), f\"radio {name} did not become checked\")"
          if old not in text:
              raise SystemExit("segmented radio patch target missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Run browser chunk
        run: |
          mkdir -p reports/live-browser-matrix
          python scripts/run_live_browser_condition_matrix.py \
            --source-country "${{ matrix.source_country }}" \
            --income-type "${{ matrix.income_type }}" \
            --lang "${{ matrix.lang }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --output "reports/live-browser-matrix/${{ matrix.source_country }}_${{ matrix.income_type }}_${{ matrix.lang }}_${{ matrix.shard }}.json"
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/taxtreat-uvicorn.log || true
      - name: Upload chunk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-${{ matrix.source_country }}-${{ matrix.income_type }}-${{ matrix.lang }}-${{ matrix.shard }}
          path: reports/live-browser-matrix
          if-no-files-found: ignore
          retention-days: 30
