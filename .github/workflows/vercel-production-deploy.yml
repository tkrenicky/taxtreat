name: Vercel production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm Vercel credential is configured
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Link TaxTreat Vercel project
        shell: bash
        run: |
          npx --yes vercel@latest link --yes --project taxtreat --token "$VERCEL_TOKEN"

      - name: Deploy current main-compatible source to production
        shell: bash
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
