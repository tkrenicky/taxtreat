name: Apply repaired UI acceptance contracts

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817
    paths:
      - scripts/apply_acceptance_contract_update.py
      - .github/workflows/apply-acceptance-contract-update.yml

permissions:
  contents: write

jobs:
  apply-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update acceptance contracts
        run: python scripts/apply_acceptance_contract_update.py
      - name: Commit acceptance updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_workspace_report_export.py scripts/render_professional_report_acceptance.py tests/test_workspace_report_export.py
          if git diff --cached --quiet; then
            echo "No acceptance changes to commit."
          else
            git commit -m "Align acceptance checks with repaired client UI"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
