name: Regenerate SK semantic artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-sk-semantic-artifacts.yml"
      - "taxtreat/tools/build_sk_treaty_semantic_candidates.py"
      - "data/legal_reviews/sk_outbound/treaty_article_machine_extraction.json"
      - "data/legal_reviews/sk_outbound/mli_notice_machine_extraction.json"
      - "data/legal_reviews/sk_outbound/human_review_coverage.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Rebuild semantic candidates and prerelease manifests
        run: |
          python -m taxtreat.tools.build_sk_treaty_semantic_candidates
          python -m taxtreat.tools.run_sk_prerelease_runtime_validation
      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legal_reviews/sk_outbound/treaty_semantic_candidates.json \
            data/legal_reviews/sk_outbound/treaty_semantic_candidates_summary.json \
            data/legal_reviews/sk_outbound/prerelease_runtime_manifest.json \
            data/legal_reviews/sk_outbound/prerelease_runtime_manifest_summary.json \
            data/legal_reviews/sk_outbound/prerelease_decision_matrix_summary.json \
            data/legal_reviews/sk_outbound/pre_review_readiness.json
          git commit -m "Regenerate SK semantic prerelease artifacts"
          git pull --rebase origin main
          git push origin main
