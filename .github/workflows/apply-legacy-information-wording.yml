name: Apply legacy information-only wording

on:
  push:
    branches:
      - redesign/unified-product-report-20260817
    paths:
      - scripts/apply_legacy_information_wording.py
      - .github/workflows/apply-legacy-information-wording.yml

permissions:
  contents: write

jobs:
  apply-wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_legacy_information_wording.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/index.html app/web/app.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Align legacy UI with information-only positioning"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi
