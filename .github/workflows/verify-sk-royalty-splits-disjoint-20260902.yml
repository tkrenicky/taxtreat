name: One-shot verify disjoint SK royalty splits

on:
  push:
    branches: [fix/sk-source-text-explicit-gaps-20260902]
    paths:
      - ".github/workflows/verify-sk-royalty-splits-disjoint-20260902.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate SK structured rules
        run: |
          python taxtreat/tools/build_sk_structured_treaty_rules.py
          python taxtreat/tools/apply_sk_mli_gates_to_structured_rules.py
      - name: Validate disjoint royalty splits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/legal_reviews/sk_outbound/structured_treaty_rule_materialization_summary.json")
          j = json.loads(p.read_text(encoding="utf-8"))
          print("materialized", j["materialized_scopes"])
          print("unresolved", j["unresolved_scopes"])
          print("modes", j["materialization_modes"])
          assert j["structured_scope_coverage"] == 225
          assert j["materialized_country_packages"] == 75
          assert j["materialized_scopes"] >= 160
          assert j["unresolved_scopes"] <= 65

          for code in ("kr", "at", "ch", "cy", "dk", "ie", "no", "cz", "us"):
              payload = json.loads((Path("data/legal_rules_sk") / f"{code}.json").read_text(encoding="utf-8"))
              rows = [r for r in payload["rules"] if r["income_type"] == "royalty" and r["legal_layer"] == "treaty"]
              print(code, [(r["rule_id"], r.get("rate"), [c.get("value") for c in r.get("conditions", []) if c.get("fact") == "royalty_category"]) for r in rows])
          PY
      - name: Remove one-shot workflow and commit artifacts
        run: |
          git rm .github/workflows/verify-sk-royalty-splits-disjoint-20260902.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legal_rules_sk data/legal_reviews/sk_outbound/structured_treaty_rule_materialization_summary.json
          git commit -m "Regenerate disjoint SK royalty category splits"
          git pull --rebase origin fix/sk-source-text-explicit-gaps-20260902
          git push
