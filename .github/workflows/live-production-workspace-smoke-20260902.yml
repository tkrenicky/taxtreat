name: Live production workspace smoke

on:
  push:
    branches: [audit/full-web-interaction-matrix-20260902]
    paths:
      - "scripts/verify_live_production_workspace_20260902.py"
      - ".github/workflows/live-production-workspace-smoke-20260902.yml"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Test live production workspace
        run: python scripts/verify_live_production_workspace_20260902.py
      - name: Commit live smoke report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live_production_workspace_smoke_20260902.json
          git diff --cached --quiet || git commit -m "Capture live production workspace smoke"
          git pull --rebase origin audit/full-web-interaction-matrix-20260902
          git push
