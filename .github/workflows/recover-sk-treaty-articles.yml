name: Recover SK treaty article text

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-sk-treaty-articles.yml"
      - "taxtreat/tools/extract_sk_treaty_articles.py"
      - "tests/test_extract_sk_treaty_articles.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Recover official treaty articles
        run: python -m taxtreat.tools.extract_sk_treaty_articles
      - name: Rebuild semantic and prerelease artifacts
        run: |
          python -m taxtreat.tools.build_sk_treaty_semantic_candidates
          python -m taxtreat.tools.run_sk_prerelease_runtime_validation
      - name: Commit recovered artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legal_reviews/sk_outbound/treaty_article_machine_extraction.json \
            data/legal_reviews/sk_outbound/treaty_article_machine_extraction_summary.json \
            data/legal_reviews/sk_outbound/treaty_semantic_candidates.json \
            data/legal_reviews/sk_outbound/treaty_semantic_candidates_summary.json \
            data/legal_reviews/sk_outbound/prerelease_runtime_manifest.json \
            data/legal_reviews/sk_outbound/prerelease_runtime_manifest_summary.json \
            data/legal_reviews/sk_outbound/prerelease_decision_matrix_summary.json \
            data/legal_reviews/sk_outbound/pre_review_readiness.json
          git commit -m "Recover SK official treaty article text"
          git pull --rebase origin main
          git push origin main
