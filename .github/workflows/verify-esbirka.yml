name: Verify e-Sbirka PDFs

on:
  push:
    branches:
      - feat/stage7b-guided-intake-20260812

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect e-Sbirka async download response
        shell: bash
        run: |
          python - <<'PY'
          import requests
          ids = [390641, 917903, 917907, 1122, 186]
          base = 'https://e-sbirka.gov.cz/sbr-externi/stahni/pravne-zavazne-zneni-vcetne-uplnych/'
          for did in ids:
              r = requests.get(base + str(did), params={'stahniOpravnouSadu':'false'}, timeout=90, allow_redirects=True)
              print(f'{did}: status={r.status_code} content_type={r.headers.get("content-type")} url={r.url}')
              print(r.text)
          PY
