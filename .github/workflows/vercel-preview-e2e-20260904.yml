name: Vercel preview E2E

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/vercel-preview-e2e-20260904.yml"

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAXTREAT_LIVE_BASE_URL: https://taxtreat-i2ad7ppal-tomaskrenicky-9671s-projects.vercel.app
      TAXTREAT_LIVE_E2E_ARTIFACT_DIR: artifacts/vercel-preview-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run preview browser audit
        run: python scripts/verify_live_production_e2e.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-e2e
          path: artifacts/vercel-preview-e2e
          if-no-files-found: ignore
