name: Vercel preview E2E

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/vercel-preview-e2e-20260904.yml"

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAXTREAT_LIVE_BASE_URL: https://taxtreat-tomaskrenicky-9671s-projects.vercel.app
      TAXTREAT_LIVE_E2E_ARTIFACT_DIR: artifacts/vercel-production-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Production HTTP diagnostics
        run: |
          set +e
          echo '=== /ui/cs ==='
          curl -sS -D /tmp/ui.headers -o /tmp/ui.body "$TAXTREAT_LIVE_BASE_URL/ui/cs"
          cat /tmp/ui.headers
          head -c 4000 /tmp/ui.body || true
          echo
          echo '=== source-country-context.js ==='
          curl -sS -D /tmp/js.headers -o /tmp/js.body "$TAXTREAT_LIVE_BASE_URL/ui-assets/source-country-context.js?v=20260819-sk1"
          cat /tmp/js.headers
          head -c 4000 /tmp/js.body || true
          echo
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run production browser audit
        run: python scripts/verify_live_production_e2e.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-production-e2e
          path: artifacts/vercel-production-e2e
          if-no-files-found: ignore
