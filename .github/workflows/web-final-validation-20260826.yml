name: WEB final validation

on:
  push:
    branches:
      - feat/web-bulk-en-treaty-acquisition-20260825
    paths:
      - '.github/workflows/web-final-validation-20260826.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-bulk-en-treaty-acquisition-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Import and pipeline smoke
        run: |
          python -c "import app.main; import taxtreat"
          python -m taxtreat.pipeline.run_pipeline
      - name: Run 101-country runtime QA
        run: python scripts/run_101_country_e2e_qa.py
      - name: Run full project test suite
        run: python -m pytest
      - name: Recheck EN coverage
        run: python scripts/build_stage6_en_rule_summary_locales_20260826.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-final-validation
          path: |
            reports/stage7_101_country_e2e_qa.json
            reports/treaty_en_rule_summary_coverage_20260826.json
          if-no-files-found: warn
