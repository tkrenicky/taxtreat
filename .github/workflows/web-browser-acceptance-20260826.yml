name: WEB browser acceptance

on:
  push:
    branches:
      - feat/web-bulk-en-treaty-acquisition-20260825
    paths:
      - '.github/workflows/web-browser-acceptance-20260826.yml'
      - 'scripts/capture_stage7b_ui.py'
      - 'app/web/**'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-bulk-en-treaty-acquisition-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Run browser E2E and capture evidence
        run: python scripts/capture_stage7b_ui.py artifacts/web-final-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-final-browser
          path: artifacts/web-final-browser
          if-no-files-found: error
          retention-days: 30
