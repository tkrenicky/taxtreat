name: WEB browser acceptance

on:
  push:
    branches:
      - feat/web-bulk-en-treaty-acquisition-20260825
    paths:
      - '.github/workflows/web-browser-acceptance-20260826.yml'
      - 'scripts/capture_stage7b_ui.py'
      - 'scripts/verify_manual_qa_i18n_20260826.py'
      - 'scripts/verify_web_integrity_guards_20260827.py'
      - 'scripts/verify_dividend_treaty_fallback_all_partners_20260828.py'
      - 'scripts/verify_en_treaty_locale_all_rules_20260828.py'
      - 'scripts/verify_condition_sensitive_intake_coverage_20260830.py'
      - 'scripts/verify_workspace_profile_and_fallback_20260828.py'
      - 'scripts/verify_en_fallback_report_locale_20260828.py'
      - 'app/web/**'
      - 'taxtreat/services/**'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-bulk-en-treaty-acquisition-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Align legacy browser harness with current navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture_stage7b_ui.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '("Přehled", "Plátci", "Příjemci", "Výpočty", "Výstupy", "Zdroje")',
              '("Přehled", "Plátci", "Příjemci", "Výsledky", "Zdroje")',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify bootstrap assets and treaty provenance mapping
        run: python scripts/verify_web_integrity_guards_20260827.py
      - name: Verify dividend treaty fallback across all partner packages
        run: python scripts/verify_dividend_treaty_fallback_all_partners_20260828.py
      - name: Verify English treaty locale coverage across all treaty rules
        run: python scripts/verify_en_treaty_locale_all_rules_20260828.py
      - name: Verify condition-sensitive intake coverage
        run: python scripts/verify_condition_sensitive_intake_coverage_20260830.py
      - name: Verify EN fallback report locale
        run: python scripts/verify_en_fallback_report_locale_20260828.py
      - name: Run browser E2E and capture evidence
        run: python scripts/capture_stage7b_ui.py artifacts/web-final-browser
      - name: Run bilingual manual-QA acceptance
        run: python scripts/verify_manual_qa_i18n_20260826.py
      - name: Run profile controls and dividend fallback acceptance
        timeout-minutes: 3
        run: python scripts/verify_workspace_profile_and_fallback_20260828.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-final-browser
          path: artifacts/web-final-browser
          if-no-files-found: error
          retention-days: 30
