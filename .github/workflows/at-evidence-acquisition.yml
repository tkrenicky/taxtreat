name: AT evidence acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "taxtreat/tools/build_at_treaty_source_inventory.py"
      - "taxtreat/tools/build_at_treaty_review_queue.py"
      - "taxtreat/tools/acquire_at_instrument_chain_pilot.py"
      - "taxtreat/tools/extract_at_treaty_article_candidates.py"
      - "taxtreat/tools/reconcile_at_article_text_candidates.py"
      - "taxtreat/tools/audit_at_royalty_categories.py"
      - "data/legal_reviews/at_outbound/**"
      - ".github/workflows/at-evidence-acquisition.yml"

concurrency:
  group: at-evidence-acquisition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire-at-treaty-universe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 pypdf==5.9.0
      - name: Archive official BMF source snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          from taxtreat.tools.build_at_treaty_source_inventory import BMF_DTT_LIST_URL

          response = requests.get(
              BMF_DTT_LIST_URL,
              timeout=30,
              headers={"User-Agent": "TaxTreat legal-source inventory/1.0"},
          )
          response.raise_for_status()
          output = Path("artifacts/at/bmf_dba_list.html")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(response.text, encoding="utf-8")
          print("Archived BMF HTML bytes:", len(response.content))
          PY
      - name: Build treaty universe from archived source
        run: |
          python -m taxtreat.tools.build_at_treaty_source_inventory \
            --input-html artifacts/at/bmf_dba_list.html \
            --as-of 2026-08-24 \
            --output artifacts/at/treaty_source_inventory_machine.json
          python -m taxtreat.tools.build_at_treaty_review_queue \
            --input artifacts/at/treaty_source_inventory_machine.json \
            --output artifacts/at/treaty_review_queue.json
      - name: Validate fail-closed acquisition output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("artifacts/at/treaty_source_inventory_machine.json").read_text(encoding="utf-8"))
          queue = json.loads(Path("artifacts/at/treaty_review_queue.json").read_text(encoding="utf-8"))
          assert inventory["source_country"] == "AT"
          assert inventory["status"] == "machine_source_inventory_not_reviewed"
          assert inventory["source_page_record_count"] == 93
          assert inventory["release_universe_candidate_count"] == 89
          assert inventory["release_universe_scope_count"] == 267
          assert queue["status"] == "review_queue_not_released"
          assert queue["treaty_partner_count"] == 89
          assert queue["scope_count"] == 267
          assert len(queue["excluded_source_records"]) == 4
          assert all(scope["release_eligible"] is False for scope in queue["scopes"])
          assert all(scope["rate_extraction"]["reviewed"] is False for scope in queue["scopes"])
          assert all(scope["instrument_chain"]["official_links"] for scope in queue["scopes"])
          print("AT universe: 93 page records / 89 current partners / 267 scopes")
          print("Excluded records:", queue["excluded_source_records"])
          PY
      - name: Acquire all current instrument chains from official BMF/RIS sources
        run: |
          python -m taxtreat.tools.acquire_at_instrument_chain_pilot \
            --input artifacts/at/treaty_source_inventory_machine.json \
            --output artifacts/at/instrument_chain_pilot.json \
            --raw-dir artifacts/at/instrument_chain_sources \
            --all-current
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/at/instrument_chain_pilot.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == 6
          assert data["status"] == "instrument_chain_pilot_acquired_not_reviewed"
          assert data["acquisition_scope"] == "all_current_partners"
          assert data["pilot_partner_count"] == 89
          assert data["source_count"] >= 89
          assert data["curated_royalty_source_override_count"] == 2
          assert all(row["instrument_chain_resolved"] is False for row in data["partners"])
          assert all(row["article_extraction_released"] is False for row in data["partners"])
          assert all(
              source["final_url"].startswith("https://")
              and len(source["sha256"]) == 64
              and source["byte_size"] > 0
              and source["legal_review_completed"] is False
              for row in data["partners"]
              for source in row["sources"]
          )
          override_partners = [row["partner_label"] for row in data["partners"] if row["curated_royalty_source_override_count"]]
          assert set(override_partners) == {"Kuba / Cuba", "Marokko / Morocco"}
          print("AT full instrument-chain acquisition:", data["pilot_partner_count"], "partners /", data["source_count"], "official sources /", data["curated_royalty_source_override_count"], "curated royalty overrides")
          print("AT curated royalty override partners:", override_partners)
          PY
      - name: Extract Article 10 11 12 text candidates with quality gate
        run: |
          python -m taxtreat.tools.extract_at_treaty_article_candidates \
            --input artifacts/at/instrument_chain_pilot.json \
            --output artifacts/at/article_candidate_inventory.json \
            --article-dir artifacts/at/article_candidates
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/at/article_candidate_inventory.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == 5
          assert data["status"] == "article_text_candidates_not_reviewed"
          assert data["partner_count"] == 89
          assert data["curated_royalty_source_override_count"] == 2
          assert all(row["primary_text_review_completed"] is False for row in data["partners"])
          assert all(row["rate_extraction_released"] is False for row in data["partners"])
          substantive = sum(sum(row["article_candidate_presence"].values()) for row in data["partners"])
          rejected = sum(sum(row["rejected_article_candidate_presence"].values()) for row in data["partners"])
          print("AT article candidates:", substantive, "substantive /", rejected, "rejected by quality gate /", data["curated_royalty_source_override_count"], "curated royalty overrides preserved")
          PY
      - name: Build article variant reconciliation queue
        run: |
          python -m taxtreat.tools.reconcile_at_article_text_candidates \
            --input artifacts/at/article_candidate_inventory.json \
            --output artifacts/at/article_candidate_reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/at/article_candidate_reconciliation.json").read_text(encoding="utf-8"))
          assert data["status"] == "article_variant_reconciliation_queue_not_reviewed"
          assert data["partner_count"] == 89
          assert all(row["instrument_chain_reconciliation_completed"] is False for row in data["partners"])
          assert all(row["release_eligible"] is False for row in data["partners"])
          missing = [
              (p["partner_label"], a["article_number"])
              for p in data["partners"]
              for a in p["articles"]
              if a["candidate_count"] == 0
          ]
          multi = [
              (p["partner_label"], a["article_number"], a["unique_text_variant_count"])
              for p in data["partners"]
              for a in p["articles"]
              if a["unique_text_variant_count"] > 1
          ]
          print("AT article reconciliation: missing substantive candidates=", len(missing), "multi-variant scopes=", len(multi))
          print("Missing candidates:", missing)
          PY
      - name: Audit royalty category branching across all 89 partners
        run: |
          python -m taxtreat.tools.audit_at_royalty_categories \
            --input artifacts/at/article_candidate_inventory.json \
            --artifact-root artifacts/at \
            --output artifacts/at/royalty_category_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/at/royalty_category_audit.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == 6
          assert data["source_country"] == "AT"
          assert data["partner_count"] == 89
          assert data["status"] == "royalty_category_machine_risk_queue_not_released"
          assert data["policy"]["raw_percentage_tokens_are_not_rate_candidates"] is True
          assert data["policy"]["ownership_threshold_percentages_cannot_create_rate_branches"] is True
          assert data["policy"]["source_exemption_language_is_a_branch_signal_not_a_synthetic_zero_rate"] is True
          assert all(row["projection_released"] is False for row in data["partners"])
          assert all(row["legal_review_completed"] is False for row in data["partners"])
          missing = [row["partner_label"] for row in data["partners"] if "no_substantive_article_12_candidate" in row["machine_risk_reasons"]]
          multi = [row["partner_label"] for row in data["partners"] if "multiple_rate_candidates_after_condition_filter" in row["machine_risk_reasons"]]
          cross_instrument = [row["partner_label"] for row in data["partners"] if "cross_instrument_rate_variance" in row["machine_risk_reasons"]]
          exemptions = [row["partner_label"] for row in data["partners"] if row["royalty_source_exemption_branch_machine"]]
          ownership = [row["partner_label"] for row in data["partners"] if row["ownership_threshold_tokens_machine"]]
          print("AT royalty audit: risk partners=", data["risk_partner_count"])
          print("AT royalty audit: no usable royalty candidate=", len(missing), "within-text multi-rate=", len(multi), "cross-instrument variance=", len(cross_instrument), "source-exemption branches=", len(exemptions), "ownership conditions=", len(ownership))
          print("AT royalty audit within-text multi-rate partners:", multi)
          print("AT royalty audit cross-instrument variance partners:", cross_instrument)
          print("AT royalty audit source-exemption partners:", exemptions)
          print("AT royalty audit ownership-condition partners:", ownership)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: at-treaty-acquisition
          path: artifacts/at
          if-no-files-found: error
          retention-days: 30
