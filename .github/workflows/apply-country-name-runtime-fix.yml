name: Apply country name runtime fix

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817
    paths:
      - scripts/apply_country_name_runtime_fix.py
      - .github/workflows/apply-country-name-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_country_name_runtime_fix.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/workspace.js tests/test_stage7b_ui.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix dynamic country name rendering"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
