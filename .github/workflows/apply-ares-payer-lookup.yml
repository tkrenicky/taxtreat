name: Apply ARES payer lookup

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817
    paths:
      - scripts/apply_ares_payer_lookup.py
      - .github/workflows/apply-ares-payer-lookup.yml

permissions:
  contents: write

jobs:
  apply-ares:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ARES integration
        run: python scripts/apply_ares_payer_lookup.py
      - name: Commit ARES integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/web/workspace.html app/web/workspace.css app/web/workspace.js scripts/check_workspace_report_export.py tests/test_ares_company_registry.py
          if git diff --cached --quiet; then
            echo "No ARES changes to commit."
          else
            git commit -m "Autofill Czech payer data from ARES"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
