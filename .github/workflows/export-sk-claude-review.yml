name: Export SK Claude review snapshot

on:
  push:
    branches:
      - export/sk-claude-review-74bcd248

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify pinned parent snapshot
        run: |
          test "$(git rev-parse HEAD^)" = "74bcd2488e96e2f1e505a3995e6f60eecc674a61"
      - name: Build repository snapshot
        run: |
          mkdir -p export
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path('.')
          out = Path('export/taxtreat-sk-review-pinned-74bcd248.zip')
          excluded = {'.git', 'export'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  parts = path.parts
                  if any(part in excluded for part in parts):
                      continue
                  z.write(path, arcname=path.as_posix())
          print(out, out.stat().st_size)
          PY
          sha256sum export/taxtreat-sk-review-pinned-74bcd248.zip > export/SHA256SUMS.txt
          printf '%s\n' 'Repository source snapshot is pinned to parent commit 74bcd2488e96e2f1e505a3995e6f60eecc674a61.' > export/PINNED_COMMIT.txt
          printf '%s\n' 'The export-only workflow commit itself is not part of the source snapshot content under review.' >> export/PINNED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sk-claude-review-repository-snapshot
          path: export
          if-no-files-found: error
          retention-days: 7
