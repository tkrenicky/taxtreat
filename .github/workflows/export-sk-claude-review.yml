name: Export SK Claude review snapshot

on:
  push:
    branches:
      - export/sk-claude-review-74bcd248
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned commit exists
        run: |
          git cat-file -e 74bcd2488e96e2f1e505a3995e6f60eecc674a61^{commit}
      - name: Build exact pinned repository snapshot
        run: |
          mkdir -p export
          git archive \
            --format=zip \
            --output=export/taxtreat-sk-review-pinned-74bcd248.zip \
            74bcd2488e96e2f1e505a3995e6f60eecc674a61
          sha256sum export/taxtreat-sk-review-pinned-74bcd248.zip > export/SHA256SUMS.txt
          printf '%s\n' 'Repository snapshot is exactly git archive of commit 74bcd2488e96e2f1e505a3995e6f60eecc674a61.' > export/PINNED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sk-claude-review-repository-snapshot
          path: export
          if-no-files-found: error
          retention-days: 7
