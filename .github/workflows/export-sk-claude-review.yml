name: Export SK Claude review snapshot

on:
  push:
    branches:
      - export/sk-claude-review-74bcd248
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verify pinned parent snapshot
        run: |
          test "$(git rev-parse HEAD^)" = "74bcd2488e96e2f1e505a3995e6f60eecc674a61"
      - name: Build repository snapshot
        run: |
          mkdir -p export
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path('.')
          out = Path('export/taxtreat-sk-review-pinned-74bcd248.zip')
          excluded = {'.git', 'export'}
          workflow = Path('.github/workflows/export-sk-claude-review.yml')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  if path == workflow:
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  z.write(path, arcname=path.as_posix())
          print(out, out.stat().st_size)
          PY
          sha256sum export/taxtreat-sk-review-pinned-74bcd248.zip > export/SHA256SUMS.txt
          printf '%s\n' 'Repository source snapshot equals pinned parent commit 74bcd2488e96e2f1e505a3995e6f60eecc674a61; the temporary export workflow is excluded.' > export/PINNED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sk-claude-review-repository-snapshot
          path: export
          if-no-files-found: error
          retention-days: 7
