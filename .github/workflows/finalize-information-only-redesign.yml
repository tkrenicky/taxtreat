name: Finalize information-only redesign
on:
  push:
    branches: [redesign/unified-product-report-20260817]
    paths:
      - scripts/finalize_information_only_redesign.py
      - .github/workflows/finalize-information-only-redesign.yml
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_information_only_redesign.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/workspace.html app/web/index.html app/web/app.js app/web/workspace.js taxtreat/services/reporting.py tests/test_stage7a_calculation.py tests/test_stage7a_reporting.py tests/test_information_only_positioning.py tests/test_stage7b_ui.py scripts/capture_stage7b_ui.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Finalize information-only redesign contract"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi