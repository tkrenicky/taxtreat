name: Fix information report and wording

on:
  push:
    branches:
      - redesign/unified-product-report-20260817
    paths:
      - scripts/fix_information_report_and_wording.py
      - .github/workflows/fix-information-report-and-wording.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_information_report_and_wording.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/index.html app/web/app.js app/web/workspace.js taxtreat/services/reporting.py tests/test_information_only_positioning.py scripts/check_workspace_report_export.py scripts/render_professional_report_acceptance.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix information report wording and rendering"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi
