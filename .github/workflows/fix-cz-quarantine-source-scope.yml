name: One-shot CZ quarantine source-scope fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cz-quarantine-source-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope CZ quarantine to CZ source country
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('taxtreat/engine/legal_rule_engine.py')
          text = path.read_text(encoding='utf-8')
          old = '    if semantic_scope in _PENDING_SEMANTIC_REMEDIATION_SCOPES:\n'
          new = '    if (\n        str(facts.get("source_country", "")).upper() == "CZ"\n        and semantic_scope in _PENDING_SEMANTIC_REMEDIATION_SCOPES\n    ):\n'
          if old not in text:
              raise SystemExit('semantic quarantine anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-cz-quarantine-source-scope.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxtreat/engine/legal_rule_engine.py .github/workflows/fix-cz-quarantine-source-scope.yml
          git commit -m 'Scope CZ semantic quarantine to CZ source country'
          git pull --rebase origin main
          git push
