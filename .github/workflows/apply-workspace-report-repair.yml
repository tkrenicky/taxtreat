name: Apply workspace and report repair

on:
  push:
    branches:
      - fix/workspace-recipient-report-20260817

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-recipient-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic repair
        run: python scripts/apply_workspace_report_repair.py
      - name: Commit repaired product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/workspace.html app/web/workspace.css app/web/workspace.js app/web/workspace-report-export.js taxtreat/services/reporting.py scripts/check_workspace_report_export.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
          else
            git commit -m "Repair recipient workflow and professional report"
            git push origin HEAD:fix/workspace-recipient-report-20260817
          fi
