name: Condition-aware legal verification

on:
  push:
    branches:
      - feat/web-bulk-en-treaty-acquisition-20260825
    paths:
      - '.github/workflows/condition-aware-verification-20260830.yml'
      - 'data/legal_rules_stage6/**'
      - 'app/web/treaty-excerpt-locales/**'
      - 'app/web/workspace.js'
      - 'taxtreat/engine/**'
      - 'taxtreat/services/**'
      - 'scripts/verify_en_treaty_locale_all_rules_20260828.py'
      - 'scripts/verify_condition_sensitive_intake_coverage_20260830.py'
      - 'scripts/verify_special_interest_priority_20260830.py'
      - 'scripts/verify_specific_branch_priority_20260830.py'
      - 'scripts/verify_royalty_taxonomy_coverage_20260830.py'
      - 'scripts/verify_royalty_mapping_regressions_20260830.py'
      - 'scripts/verify_holding_period_regressions_20260830.py'
      - 'scripts/verify_dividend_condition_semantics_20260830.py'
      - 'scripts/verify_dividend_rule_normalization_20260830.py'
      - 'scripts/verify_en_fallback_report_locale_20260828.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project without external dependencies
        run: python -m pip install --no-deps -e .
      - name: Run complete verifier suite and capture diagnostics
        id: suite
        shell: bash
        run: |
          mkdir -p artifacts/condition-aware-verification
          status=0
          scripts=(
            verify_en_treaty_locale_all_rules_20260828.py
            verify_condition_sensitive_intake_coverage_20260830.py
            verify_special_interest_priority_20260830.py
            verify_specific_branch_priority_20260830.py
            verify_royalty_taxonomy_coverage_20260830.py
            verify_royalty_mapping_regressions_20260830.py
            verify_holding_period_regressions_20260830.py
            verify_dividend_condition_semantics_20260830.py
            verify_dividend_rule_normalization_20260830.py
            verify_en_fallback_report_locale_20260828.py
          )
          for script in "${scripts[@]}"; do
            name="${script%.py}"
            echo "=== $script ==="
            set +e
            python "scripts/$script" >"artifacts/condition-aware-verification/$name.txt" 2>&1
            code=$?
            set -e
            cat "artifacts/condition-aware-verification/$name.txt"
            printf 'exit_code=%s\n' "$code" >>"artifacts/condition-aware-verification/$name.txt"
            if [ "$code" -ne 0 ]; then
              status=1
            fi
          done
          echo "suite_status=$status" > artifacts/condition-aware-verification/SUMMARY.txt
          exit "$status"
      - name: Upload complete verifier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condition-aware-verification
          path: artifacts/condition-aware-verification
          if-no-files-found: error
          retention-days: 30
