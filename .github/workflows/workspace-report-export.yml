name: Workspace report export acceptance

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  workspace-report-export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run workspace report export unit coverage
        run: python -m pytest tests/test_workspace_report_export.py

      - name: Run workspace report export browser acceptance
        run: python scripts/check_workspace_report_export.py
