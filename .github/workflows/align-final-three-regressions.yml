name: Align final three regressions
on:
  push:
    branches: [redesign/unified-product-report-20260817]
    paths:
      - scripts/align_final_three_regressions.py
      - .github/workflows/align-final-three-regressions.yml
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/unified-product-report-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/align_final_three_regressions.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_stage7a_calculation.py tests/test_stage7b_ui.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Align final redesign regression expectations"
            git push origin HEAD:redesign/unified-product-report-20260817
          fi